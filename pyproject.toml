[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-routing-calibration"
version = "0.1.0"
description = "Reproduction pipeline for routing-conditional calibration audits."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
jevcal = "jevcal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

